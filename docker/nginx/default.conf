server {
    listen 80;
    server_name localhost;

    # Padanan dari: DocumentRoot /var/www/html/public
    root /var/www/html/public;
    index index.php index.html;

    # Padanan dari: CustomLog & ErrorLog
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Padanan dari: AllowOverride All (Handling URL routing Laravel)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Blok Wajib Nginx untuk Memproses File PHP via PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # 'app' adalah nama service container PHP di docker-compose.yml
        fastcgi_pass app:9000; 
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Blok Keamanan Tambahan (Menolak akses ke file tersembunyi seperti .htaccess/.env)
    location ~ /\.ht {
        deny all;
    }
}